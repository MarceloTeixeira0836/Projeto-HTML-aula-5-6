<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Formulário HTML</title>
</head>
<body>
    <header>
        <h3> Formulários e Inputs</h3>

    </header>
    <main>
        <!-- anotação aleatoria para fazer anotação seleciona o comentário e aperta o CTRL e : -->
            <form id="registerForm" method="POST">
                <label> Nome Completo: </label>
                <input type="text" id="nome" name="nome" required/>
                <!-- input serve para inserir dados, type voce define o que sera inserido no input/label  -->
                <br>
                <label for="e-mail" > Endereço de e-mail: </label>
                <input type="email" id="email" name="email"/>
                <br>
                <label for="senha"> Informe sua senha:</label>
                <input type="password" id="senha" name="senha" required minlength="8" title="A senha deve ter no minímo 8 caracteres"/>
                <br>
                <label for="mensagem"> Informe sua mensagem:</label>
                <br>
                <textarea name="mensagem" id="mensagem" cols="30" rows="4"></textarea>
                <br>
                <label for="evento">Selecione o evento escolhido neném:</label>
                <select id="evento" name="evento">
                    <option value="rock">Show de Punk</option>
                    <option value="rockzao">Show de Punk 2.0</option>
                    <option value="rock3">Show de Punk 3.0</option>
                </select>
                <br>
                <!-- Input checkbox -> Opção de multipla escolha: -->
                <label for="termos">
                    <input type="checkbox" id="termos" name="termos" required>
                    Aceitarás os nossos grandiosos termos de uso?
                </label>
                <br>
                <!-- Input type radio - Escolha única -->
                <label> <input type="radio" name="pagamento" value="pix"> Pix </label>
                <label> <input type="radio" name="pagamento" value="cartao"> Cartão </label>
                <br>
                <input type="date"/>
                <br>
                <input type="file"/>
                <br> <br>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato esperado: 000.000.000-00"/>
                <!-- Para o type radio funcionar ambos os inputs devem compartilhar o mesmo name -->
                <br><br>

                <input type="submit" value="Cadastrar"/>
                <button type="button" onclick="">Cancelar</button>
                
                
            </form>
    </main>
    <footer>
        <p>Desenvolvido por Teixeira</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) 
        {
            event.preventDefault(); // impede o comportamento padrão de envio do formulário (recarregamento)
            const nome = document.getElementById('nome').value;
            alert('Olá,'+ nome+' cadastro enviado com sucesso bocó');
        })
    </script>
</body>
</html>
